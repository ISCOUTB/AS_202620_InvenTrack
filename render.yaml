services:
  - type: web
    name: inventrack-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: INVENTRACK_ENV
        value: production
      - key: INVENTRACK_ALLOW_BUSINESS_DATA
        value: "false"