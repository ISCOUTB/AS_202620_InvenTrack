name: Run Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install --require-hashes --only-binary :all: -r requirements.txt

    - name: Run Pytest with coverage
      run: |
        PYTHONPATH=. pytest -v --cov=. --cov-report=xml

    # SonarCloud temporalmente desactivado para mantener el pipeline CI funcional
    # mientras se resuelve la autorización del token y los permisos del proyecto.
    - name: Set up Java 21
      uses: actions/setup-java@v4
      with:
         distribution: 'temurin'
         java-version: '21'

    - name: SonarCloud Scan
      uses: SonarSource/sonarqube-scan-action@c7ee0f9df90b7aa20e8dcf9695dcfe2e7da5b4f2
      env:
         GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
         SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    - name: Validate versioned API contract
      run: |
        PYTHONPATH=. pytest -v tests/contract/test_openapi_contract.py
