name: Deploy API

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - Dockerfile
      - infra/**
      - app/**
      - requirements.txt

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set up Azure CLI
        uses: azure/cli@v2
        with:
          inlineScript: az version

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Create Terraform state storage
        env:
          STORAGE_ACCOUNT: ${{ secrets.AZURE_TF_STORAGE_ACCOUNT }}
          STORAGE_RESOURCE_GROUP: ${{ secrets.AZURE_TF_STORAGE_RESOURCE_GROUP }}
        run: |
          az storage container create --name tfstate \
            --account-name "${STORAGE_ACCOUNT}" \
            --auth-mode login >/dev/null

      - name: Initialize Terraform
        working-directory: infra
        env:
          TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TF_STATE_STORAGE_ACCOUNT: ${{ secrets.AZURE_TF_STORAGE_ACCOUNT }}
        run: terraform init \
          -backend-config="resource_group_name=${{ secrets.AZURE_TF_STORAGE_RESOURCE_GROUP }}" \
          -backend-config="storage_account_name=${TF_STATE_STORAGE_ACCOUNT}" \
          -backend-config="container_name=tfstate"

      - name: Create Azure Container Registry
        working-directory: infra
        env:
          TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: terraform apply -target=azurerm_container_registry.api -auto-approve

      - name: Read container registry name
        working-directory: infra
        run: terraform output -raw registry_name > "$RUNNER_TEMP/registry_name"

      - name: Build and publish container
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          REGISTRY="$(cat "$RUNNER_TEMP/registry_name")"
          az acr login --name "${REGISTRY}"
          docker build -t "${REGISTRY}.azurecr.io/inventrack-api:${IMAGE_TAG}" .
          docker push "${REGISTRY}.azurecr.io/inventrack-api:${IMAGE_TAG}"

      - name: Deploy with Terraform
        working-directory: infra
        env:
          TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_image_tag: ${{ github.sha }}
        run: |
          terraform apply -auto-approve
          terraform output -raw service_url > "$RUNNER_TEMP/public_api_url"

      - name: Smoke test public deployment
        run: |
          PUBLIC_API_URL="$(cat "$RUNNER_TEMP/public_api_url")"
          curl --fail --silent --show-error --retry 10 --retry-delay 10 \
            "$PUBLIC_API_URL/health"
